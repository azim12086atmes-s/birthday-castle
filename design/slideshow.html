const q=new URLSearchParams(location.search);
let i=Math.max(0,(parseInt(q.get('start')||'1')-1)), dwell=(parseFloat(q.get('sec')||'25'))*1000, t0;
const img=document.getElementById('img'),bar=document.getElementById('bar'),prog=document.getElementById('prog');
function show(){ if(i>=R.length){bar.textContent='END - all '+R.length+' shown';img.removeAttribute('src');return;}
 const r=R[i]; bar.textContent='#'+(i+1)+'/'+R.length+'  '+r.id+'  |  '+r.note; img.src=r.url; t0=Date.now();}
img.onerror=()=>{bar.textContent+='   [FAILED TO LOAD]';};
setInterval(()=>{const f=(Date.now()-t0)/dwell; prog.style.width=Math.min(100,f*100)+'%'; if(f>=1){i++;show();}},200);
show();
