<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Column source panels</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:1rem}details{margin:1rem 0}summary{cursor:pointer}img{max-width:100%;height:auto}</style><h1>Original column source panels</h1><p>Seven existing source panels; open one at a time.</p><details><summary>Column assembly</summary><img data-src="column-assembly.png" alt="Column assembly"></details><details><summary>Lotus capital front elevation</summary><img data-src="lotus-capital-front-elevation.png" alt="Lotus capital front elevation"></details><details><summary>Lotus capital underside and socket</summary><img data-src="lotus-capital-underside-and-socket.png" alt="Lotus capital underside and socket"></details><details><summary>Column section and joinery</summary><img data-src="column-section-and-joinery.png" alt="Column section and joinery"></details><details><summary>Portal pier and arch springing</summary><img data-src="portal-pier-and-arch-springing.png" alt="Portal pier and arch springing"></details><details><summary>Column base and plinth</summary><img data-src="column-base-and-plinth.png" alt="Column base and plinth"></details><details><summary>Leaf carving close-up</summary><img data-src="leaf-carving-close-up.png" alt="Leaf carving close-up"></details><script>document.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{let i=d.querySelector("img");if(d.open){document.querySelectorAll("details").forEach(o=>{if(o!==d)o.open=false});i.src=i.dataset.src}else{i.removeAttribute("src")}}));</script></html>
