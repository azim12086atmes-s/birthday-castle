<text x="825" y="668" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">MATERIAL / PERFORMANCE / SOURCE TRACE</text>
<text x="830" y="695" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">High detail sculpt → low silhouette mesh → normal/AO/trim bake; instance</text>
