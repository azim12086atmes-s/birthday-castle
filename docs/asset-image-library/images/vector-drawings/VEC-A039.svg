<text x="390" y="700" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">Pierced scroll back, cedar slats,</text>
<text x="390" y="726" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">lotus feet, embroidered cushion.</text>
<text x="390" y="840" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">Variants: intact / weathered /</text>
<text x="390" y="863" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">celebration. Keep the family</text>
<text x="390" y="886" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">silhouette; vary relief, color</text>
<text x="390" y="909" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">masks and dressing.</text>
