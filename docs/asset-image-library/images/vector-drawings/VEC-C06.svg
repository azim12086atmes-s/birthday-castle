<text x="855" y="168" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">GARDEN ROOMS / DETAIL &amp; ACCESS</text>
<text x="865" y="200" fill="#24263d" font-family="Georgia,serif" font-size="20" text-anchor="start">R01 / WEST HANGING ROSE TERRACE</text>
<text x="865" y="234" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Asymmetric L wing, rose-knot parterres, two-level fountain</text>
<text x="865" y="258" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">cascade, scroll benches, embroidered shade drapes; A019,</text>
<text x="865" y="282" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">A035–A042, A049, A070.</text>
<text x="865" y="354" fill="#24263d" font-family="Georgia,serif" font-size="20" text-anchor="start">R02 / EAST LOTUS CONSERVATORY</text>
<text x="865" y="388" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Curved glass pergola, shallow lotus reflecting pool, crystal</text>
<text x="865" y="412" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">fountain, jali guard rail, lantern walks and orchid beds; A015,</text>
<text x="865" y="436" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">A027–A032, A035, A042, A077.</text>
<text x="865" y="508" fill="#24263d" font-family="Georgia,serif" font-size="20" text-anchor="start">R03 / NORTH MOON FOUNTAIN LOGGIA</text>
<text x="865" y="542" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Three-tier fountain, moon mirror court, gilded arcade, hanging</text>
<text x="865" y="566" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">charms and private princess belvederes; A009, A018, A020, A036,</text>
<text x="865" y="590" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">A047, A059.</text>
<text x="865" y="662" fill="#24263d" font-family="Georgia,serif" font-size="20" text-anchor="start">CONNECTIONS / GARDEN LOOP</text>
<text x="865" y="696" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Exterior stair and covered roof walk join all three gardens;</text>
<text x="865" y="720" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">passages stay clear and at human scale. A021, A022, A038, A090.</text>
<text x="865" y="744" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Railings and collision surfaces remain continuous.</text>
<text x="865" y="816" fill="#24263d" font-family="Georgia,serif" font-size="20" text-anchor="start">DETAIL HIERARCHY / EVERY SURFACE ZONE</text>
<text x="865" y="850" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">Roof paving gets inlay and worn joints; walls get shallow</text>
<text x="865" y="874" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">arabesque; edges get carved trim; corners get urns; overhead</text>
<text x="865" y="898" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">gets lanterns and swags. Avoid disguising entrances or walking</text>
<text x="865" y="922" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">paths.</text></svg>