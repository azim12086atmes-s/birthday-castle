<text x="390" y="700" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">Cusped pointed opening, rosette</text>
<text x="390" y="726" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">spandrels, ablaq border.</text>
<text x="390" y="840" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">Variants: intact / weathered /</text>
<text x="390" y="863" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">celebration. Keep the family</text>
<text x="390" y="886" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">silhouette; vary relief, color</text>
<text x="390" y="909" fill="#24263d" font-family="Georgia,serif" font-size="16" text-anchor="start">masks and dressing.</text>
<rect x="810" y="640" width="740" height="380" rx="0" fill="none" stroke="#d4c6ad" stroke-width="1"/>
<text x="825" y="668" fill="#24263d" font-family="Georgia,serif" font-size="19" text-anchor="start">MATERIAL / PERFORMANCE / SOURCE TRACE</text>
<text x="830" y="695" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">High detail sculpt → low silhouette mesh → normal/AO/trim bake; instance</text>
<text x="830" y="719" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">repeated modules.</text>
<text x="830" y="790" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">LOD: near / mid / far. Relief budget and switching distances depend on</text>
<text x="830" y="814" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">projected size, not only metres. Design targets require later</text>
<text x="830" y="838" fill="#24263d" font-family="Georgia,serif" font-size="17" text-anchor="start">profiling.</text>
<text x="830" y="905" fill="#24263d" font-family="Georgia,serif" font-size="15" text-anchor="start">Catalogue sources: U05, U74, U93, U133, U145, U150, U151, U197, U221,</text>
<text x="830" y="927" fill="#24263d" font-family="Georgia,serif" font-size="15" text-anchor="start">U252</text>
<text x="830" y="990" fill="#24263d" font-family="Georgia,serif" font-size="14" text-anchor="start">Legend: schematic family views; dimensions govern the envelope.</text></svg>